# Docker Compose for Knowledge OS
# Secrets management (H55): Supports Docker secrets with env_file fallback.
# To use Docker secrets: define a `secrets:` block and reference via `secrets:` on services.
# To use env_file (simpler): create a .env file in the same directory.

services:
  # Qdrant Vector Database (H53: ports bound to localhost only)
  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6335}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./backups/snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
    restart: unless-stopped
    networks:
      - knowledge-os-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    # env_file: .env  # Uncomment and create .env for local secrets (H55)
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:///app/data/knowledge_os.db
      - OPENCLAW_URL=${OPENCLAW_URL:-http://host.docker.internal:18789}
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
      - BACKUP_PATH=/app/backups
      - WATCHED_FOLDERS_PATH=/app/data/watched_folders.json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/data/logs
      - ./backups:/app/backups
      # Mount host directories for file watching (configure as needed)
      - ${HOME}/Documents:/host/documents:ro
      - ${HOME}/Projects:/host/projects:ro
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - knowledge-os-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend (served via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3010}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowledge-os-network

  # File Watcher Service (optional - can also run in backend)
  file-watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile.watcher
    environment:
      - BACKEND_URL=http://backend:8000
      - WATCH_INTERVAL=5
    volumes:
      - ${HOME}/Documents:/host/documents:ro
      - ${HOME}/Projects:/host/projects:ro
      - file-watcher-data:/app/data
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowledge-os-network
    profiles:
      - with-watcher  # Only start when explicitly requested

volumes:
  qdrant-storage:
    driver: local
  backend-data:
    driver: local
  backend-logs:
    driver: local
  file-watcher-data:
    driver: local

networks:
  knowledge-os-network:
    driver: bridge
