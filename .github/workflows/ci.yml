name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: LifeOps Core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of requires-python: the tests/spec crash on 3.11 was
        # invisible while CI pinned 3.12 alone.
        python-version: ["3.11", "3.12"]
    services:
      # A disposable NornicDB, per BUILD_SPEC section 85. Loopback-mapped like
      # every other deployment.
      nornicdb:
        image: timothyswt/nornicdb-amd64-cpu-bge:1.2.2
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NORNICDB_DATA_DIR: /data
          NORNICDB_ADMIN_PASSWORD: ci-test-password
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7474/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 40s

    env:
      LIFEOPS_NORNIC_URI: bolt://127.0.0.1:7687
      LIFEOPS_NORNIC_USER: admin
      LIFEOPS_NORNIC_PASSWORD: ci-test-password
      LIFEOPS_STATE_DIR: ${{ github.workspace }}/.ci-state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check core tests

      - name: Type check
        run: mypy

      - name: Unit, policy, spec, and API tests
        run: pytest tests/unit tests/policy tests/spec tests/integration -q

      - name: Persistence tests
        run: pytest tests/persistence -q

      - name: Phase 0 exit test
        run: pytest tests/e2e -q

      # No credential may be needed to boot, and none may be committed
      # (BUILD_SPEC sections 88 and 104).
      - name: Assert no secret is tracked
        run: |
          if git ls-files | grep -E '(master\.key|secrets\.json|nornicdb\.env)$'; then
            echo "A secret file is tracked in git." >&2
            exit 1
          fi

      - name: Assert no prohibited datastore is a runtime dependency
        run: |
          deps=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(" ".join(tomllib.load(fh)["project"]["dependencies"]))
          PY
          )
          for banned in sqlalchemy alembic qdrant redis psycopg asyncpg temporalio kafka pika; do
            if echo "$deps" | grep -qi "$banned"; then
              echo "Prohibited dependency: $banned" >&2
              exit 1
            fi
          done
          echo "Dependencies clean."

  console:
    name: LifeOps Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
