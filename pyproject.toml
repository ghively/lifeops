[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeops"
version = "0.1.0"
description = "LifeOps Core — portable personal domain/API layer, safety boundary, and MCP server for Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "cryptography>=42",
    "mcp>=1.2",
    "python-ulid>=2.2",
    "httpx>=0.27",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
# BUILD_SPEC section 28/30's local voice path (LocalASRProvider,
# LocalTTSProvider — core/lifeops/voice/local.py). Not installed by default:
# AGENTS.md requires a written dependency justification, and this one is a
# multi-gigabyte GPU-oriented stack that most deployments never touch.
#   Problem:              ElevenLabs-only voice means no working offline/
#                          local-privacy voice path, and BUILD_SPEC section
#                          29's Hybrid/Local modes have nothing to select.
#   Existing capability:  none — no local ASR/TTS runtime is importable
#                          without these packages.
#   Why it is required:   faster-whisper and kokoro are the concrete,
#                          real Python packages behind BUILD_SPEC section
#                          30's named candidates (faster-whisper large-v3-
#                          turbo/distil-large-v3; Kokoro as the TTS
#                          fallback/reference candidate).
#   Operational cost:     GPU-class disk/VRAM footprint, model weights
#                          downloaded from Hugging Face on first load.
#   Removal plan:         delete this extra and core/lifeops/voice/local.py's
#                          lazy imports; nothing else in the codebase imports
#                          faster_whisper or kokoro.
voice-local = [
    "faster-whisper>=1.0",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
]

[project.scripts]
lifeops = "lifeops.main:main"
lifeops-mcp = "lifeops.mcp.server:main"

[tool.setuptools.packages.find]
where = ["core"]
include = ["lifeops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running NornicDB instance",
    "persistence: verifies durability across restarts",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "core"
packages = ["lifeops"]
ignore_missing_imports = true
warn_unused_ignores = true
